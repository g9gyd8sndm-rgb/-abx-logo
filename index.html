<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AngelBucks (ABX)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#111; color:#fff; text-align:center; padding:40px 20px; }
    img { width:120px; height:120px; border-radius:50%; object-fit:cover; }
    button { margin-top:25px; padding:16px 24px; border:0; border-radius:12px; font-size:18px; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/g9gyd8sndm-rgb/-abx-logo/main/C5CD381D-645A-4C43-BF59-384E66A77681.png" alt="AngelBucks logo">
  <h1>AngelBucks (ABX)</h1>
  <p>BNB Smart Chain</p>
  <button id="add">MetaMask에 ABX 추가</button>

  <script>
    const token = {
      address: "0x81889fbE2Fe2Ad3EFeCb7C50A097fD89D56b8A3F",
      symbol: "ABX",
      decimals: 18,
      image: "https://raw.githubusercontent.com/g9gyd8sndm-rgb/-abx-logo/main/C5CD381D-645A-4C43-BF59-384E66A77681.png"
    };

    document.getElementById("add").onclick = async () => {
      if (!window.ethereum) {
        alert("MetaMask 앱에서 이 페이지를 열어주세요.");
        return;
      }
      try {
        const added = await window.ethereum.request({
          method: "wallet_watchAsset",
          params: { type: "ERC20", options: token }
        });
        alert(added ? "ABX가 MetaMask에 추가되었습니다." : "추가가 취소되었습니다.");
      } catch (e) {
        alert("MetaMask 추가 중 오류가 발생했습니다.");
      }
    };
  </script>
</body>
</html>
